name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        container:
            image: devkitpro/devkita64:latest

        steps:
            - uses: actions/checkout@v6

            - uses: lukka/get-cmake@latest

            - name: Install host build tools (needed for local curl build)
              run: |
                sudo apt-get update
                sudo apt-get install -y autoconf automake libtool pkg-config patch

            - name: Build
              run: bash scripts/build.sh

            - name: Create release package
              run: bash scripts/release.sh

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: build/NX-ScreenUploader.zip
                  archive: false
